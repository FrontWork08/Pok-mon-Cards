name: Build Android APK

# APK builds are release-controlled.
# Day-to-day app changes ship through Expo Updates; public APK releases use the production channel.
# Native releases are blocked unless SHA-256 + Android signature + pinned signer certificate all verify.
on:
  workflow_dispatch:
  push:
    branches:
      - apk-release

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify project before native release
        run: npm run verify

      - name: Locate Android signature verifier
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER_PATH="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER_PATH" ]; then
            echo "apksigner was not found; refusing to create an unverified public APK."
            exit 1
          fi
          chmod +x "$APKSIGNER_PATH"
          echo "APKSIGNER=$APKSIGNER_PATH" >> "$GITHUB_ENV"
          "$APKSIGNER_PATH" version

      - name: Build, download and verify release APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run apk

      - name: Validate published download metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('public/download/release.json','utf8'));
          const trusted = JSON.parse(fs.readFileSync('public/download/trusted-signing-cert.json','utf8'));
          const hex = (v) => String(v ?? '').replace(/[^a-fA-F0-9]/g,'').toLowerCase();
          const cert = hex(release.verification?.certificateSha256);
          const trustedCert = hex(trusted.certificateSha256);
          if (release.status !== 'ready') throw new Error('Release is not ready');
          if (!/^https:\/\//.test(release.downloadUrl || '')) throw new Error('Release URL must use HTTPS');
          if (!/^[a-f0-9]{64}$/i.test(release.sha256 || '')) throw new Error('Invalid APK SHA-256');
          if (!(Number(release.sizeBytes) > 0)) throw new Error('Invalid APK size');
          if (release.packageName !== 'com.frontwork.pokemoncards') throw new Error('Unexpected Android package');
          if (release.verification?.sha256Verified !== true) throw new Error('APK hash was not verified');
          if (release.verification?.signatureVerified !== true) throw new Error('APK signature was not verified');
          if (release.verification?.signerMatchesTrustedCertificate !== true) throw new Error('APK signer was not pinned');
          if (!/^[a-f0-9]{64}$/.test(cert) || cert !== trustedCert) throw new Error('APK signer certificate mismatch');
          if (!release.verification?.verifiedAt) throw new Error('Missing verification timestamp');
          console.log('APK metadata, hash, signature and trusted signer certificate are valid.');
          NODE

      - name: Upload verified APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Collection-Android-Verified
          path: builds/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish download metadata
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp public/download/release.json /tmp/trainer-release.json
          git fetch origin main
          git checkout -B release-metadata origin/main
          cp /tmp/trainer-release.json public/download/release.json

          git add public/download/release.json
          if git diff --cached --quiet; then
            echo "Release metadata already current."
            exit 0
          fi

          git commit -m "release: update verified Android download metadata"
          git push origin HEAD:main

      - name: Deploy updated download site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull --environment preview --path .env.local --non-interactive
          npx expo export --platform web
          eas deploy --prod --environment preview --dev-domain pokemon-cards-frontwork --non-interactive
