name: Build Android APK

# APK builds are intentionally manual.
# Day-to-day app changes ship through Expo Updates on the preview channel.
# Trigger this workflow only when the native runtime really changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Build and download preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Collection-Android
          path: builds/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate published download metadata
        run: |
          node -e "const fs=require('fs'); const p='public/download/release.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.status!=='ready'||!/^https:\/\//.test(x.downloadUrl)||!/^[a-f0-9]{64}$/i.test(x.sha256)||!(x.sizeBytes>0)){throw new Error('Invalid release metadata')}"

      - name: Publish download metadata
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/release.json
          if git diff --cached --quiet; then
            echo "Release metadata already current."
            exit 0
          fi
          git commit -m "release: update Android download metadata"
          git pull --rebase origin main
          git push origin HEAD:main
