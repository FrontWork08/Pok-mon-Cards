name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - assets/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and download preview APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npm run apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Cards-Android
          path: builds/*.apk
          if-no-files-found: error
          retention-days: 14
