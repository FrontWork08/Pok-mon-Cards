name: Build Android APK

# APK builds are release-controlled. The official Trainer Collection page validates
# release metadata while GitHub Releases serves the signed APK archive.
on:
  workflow_dispatch:
  push:
    branches:
      - apk-release
      - main
    paths:
      - app.json
      - package.json
      - package-lock.json
      - eas.json
      - src/services/soundEffects.ts
      - src/services/battleEffects.ts
      - scripts/native-runtime-baseline.json

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lock native artwork to v1.1 Rayquaza source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          BASE_TAG="android-v1.1.0"
          test "$(git rev-parse HEAD:assets/trainer-poster-base64)" = "$(git rev-parse ${BASE_TAG}:assets/trainer-poster-base64)"
          test "$(git rev-parse HEAD:assets/icon.png)" = "$(git rev-parse ${BASE_TAG}:assets/icon.png)"
          test "$(git rev-parse HEAD:assets/adaptive-icon.png)" = "$(git rev-parse ${BASE_TAG}:assets/adaptive-icon.png)"
          echo "Rayquaza artwork source is byte-identical to Trainer Collection 1.1.0."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify project before native release
        run: npm run verify

      - name: Locate Android signature verifier
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER_PATH="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER_PATH" ] || [ ! -x "$APKSIGNER_PATH" ]; then
            echo "apksigner was not found; refusing to create an unverified public APK."
            exit 1
          fi
          echo "APKSIGNER=$APKSIGNER_PATH" >> "$GITHUB_ENV"
          "$APKSIGNER_PATH" version

      - name: Build clean, download and verify release APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile release-apk --non-interactive --clear-cache
          npm run apk:download

      - name: Verify native Trainer sounds inside APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="$(find builds -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          node scripts/verify-apk-sounds.mjs "$SOURCE_APK"

      - name: Publish verified archive and download metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./public/download/release.json').version")"
          SOURCE_APK="$(find builds -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          FRIENDLY_NAME="Trainer-Collection-v${VERSION}.apk"
          FRIENDLY_APK="/tmp/${FRIENDLY_NAME}"
          cp "$SOURCE_APK" "$FRIENDLY_APK"

          TAG="android-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing verified archive asset."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Trainer Collection v${VERSION}" --notes "APK oficial do Trainer Collection. Arquivo verificado por SHA-256 e assinatura Android. A página oficial valida esta release e o binário é servido pelo GitHub Release oficial."
          fi
          gh release upload "$TAG" "$FRIENDLY_APK" --repo "$GITHUB_REPOSITORY" --clobber

          ARCHIVE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FRIENDLY_NAME}"
          EAS_JSON="$(eas build:list --platform android --profile release-apk --status finished --limit 1 --json --non-interactive)"
          export EAS_JSON
          EAS_BUILD_ID="$(node -e "const x=JSON.parse(process.env.EAS_JSON); const b=Array.isArray(x)?x[0]:x.builds?.[0]; if(!b?.id) process.exit(2); process.stdout.write(b.id)")"
          EAS_BUILD_URL="https://expo.dev/accounts/frontwork/projects/pokemon-cards/builds/${EAS_BUILD_ID}"
          export ARCHIVE_URL EAS_BUILD_ID EAS_BUILD_URL FRIENDLY_NAME

          node <<'NODE'
          const fs = require('fs');
          const p = 'public/download/release.json';
          const release = JSON.parse(fs.readFileSync(p, 'utf8'));
          release.downloadUrl = 'https://pokemon-cards-frontwork.expo.app/download-apk';
          release.downloadFileName = process.env.FRIENDLY_NAME;
          release.downloadProvider = 'Trainer Collection Site';
          release.easBuildId = process.env.EAS_BUILD_ID;
          release.easBuildUrl = process.env.EAS_BUILD_URL;
          release.archiveUrl = process.env.ARCHIVE_URL;
          fs.writeFileSync(p, JSON.stringify(release, null, 2) + '\n');
          NODE

          curl --fail --location --retry 4 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/friendly-recheck.apk
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          ACTUAL_SHA="$(sha256sum /tmp/friendly-recheck.apk | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          node scripts/verify-apk-sounds.mjs /tmp/friendly-recheck.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/friendly-recheck.apk >/tmp/friendly-recheck-signature.txt
          echo "Release archive is byte-identical to the signed build; verified public archive is $ARCHIVE_URL"

      - name: Validate published download metadata
        run: node scripts/apk-security-audit.mjs

      - name: Upload verified APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Collection-Android-Verified
          path: builds/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish download metadata
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/download/release.json /tmp/trainer-release.json
          git fetch origin main
          git checkout -B release-metadata origin/main
          cp /tmp/trainer-release.json public/download/release.json
          git add public/download/release.json
          if ! git diff --cached --quiet; then
            git commit -m "release: update verified Android download metadata"
            git push origin HEAD:main
          else
            echo "Release metadata already current."
          fi

      - name: Export updated download site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas env:pull --environment production --path .env.local --non-interactive
          npx expo export --platform web

      - name: Deploy updated download site
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --prod --environment production --dev-domain pokemon-cards-frontwork --non-interactive

      - name: Verify official page metadata and release archive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/apk-release'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          EXPECTED_URL="$(node -p "require('./public/download/release.json').downloadUrl")"
          EXPECTED_FILE="$(node -p "require('./public/download/release.json').downloadFileName")"
          VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            CACHE_BUSTER="${GITHUB_SHA}-${attempt}"
            curl --fail --location --retry 2 --retry-delay 1 "https://pokemon-cards-frontwork.expo.app/download-release?v=${CACHE_BUSTER}" -o /tmp/site-release.json
            SITE_SHA="$(node -p "require('/tmp/site-release.json').sha256")"
            SITE_URL="$(node -p "require('/tmp/site-release.json').downloadUrl")"
            SITE_FILE="$(node -p "require('/tmp/site-release.json').downloadFileName")"
            if [[ "${SITE_SHA,,}" == "${EXPECTED_SHA,,}" && "$SITE_URL" == "$EXPECTED_URL" && "$SITE_FILE" == "$EXPECTED_FILE" ]]; then
              VERIFIED=1
              break
            fi
            echo "Release metadata not propagated yet (attempt ${attempt}/6)."
            sleep 3
          done
          [[ "$VERIFIED" == "1" ]]
          curl --fail --location --retry 4 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/release-final.apk
          test "$(stat -c%s /tmp/release-final.apk)" -gt 100000000
          ACTUAL_SHA="$(sha256sum /tmp/release-final.apk | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          node scripts/verify-apk-sounds.mjs /tmp/release-final.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/release-final.apk >/tmp/release-final-signature.txt

          curl --fail --location --retry 6 --retry-delay 3 --retry-all-errors --range 0-1048575             -D /tmp/site-apk-headers.txt             "$EXPECTED_URL"             -o /tmp/site-apk-chunk.bin
          head -c 1048576 /tmp/release-final.apk > /tmp/archive-apk-chunk.bin
          [[ "$(sha256sum /tmp/site-apk-chunk.bin | awk '{print $1}')" == "$(sha256sum /tmp/archive-apk-chunk.bin | awk '{print $1}')" ]]
          grep -qi "content-disposition: attachment; filename=\"$EXPECTED_FILE\"" /tmp/site-apk-headers.txt
          echo "Official page streams the exact verified release APK from the site domain."
