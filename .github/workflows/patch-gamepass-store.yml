name: Patch Gamepass Store Discovery
on:
  push:
    paths:
      - .github/workflows/patch-gamepass-store.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch store entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/store.tsx')
          s=p.read_text()
          old="""<Pressable onPress={()=>router.push('/auto-open')} style={[styles.gamepassButton,{backgroundColor:boosterPerks?.autoOpenGamepass?'#59D49A':colors.yellow}]}>
          <Ionicons name={boosterPerks?.autoOpenGamepass?'play':'information-circle'} size={17} color=\"#07111F\"/>
          <Text style={styles.gamepassButtonText}>{boosterPerks?.autoOpenGamepass?'ABRIR AUTO BOOSTER':'COMO COMPRAR'}</Text>
        </Pressable>"""
          new="""<Pressable onPress={()=>router.push(boosterPerks?.autoOpenGamepass?'/auto-open':'/gamepasses')} style={[styles.gamepassButton,{backgroundColor:boosterPerks?.autoOpenGamepass?'#59D49A':colors.yellow}]}>
          <Ionicons name={boosterPerks?.autoOpenGamepass?'play':'diamond'} size={17} color=\"#07111F\"/>
          <Text style={styles.gamepassButtonText}>{boosterPerks?.autoOpenGamepass?'ABRIR AUTO BOOSTER':'VER TODAS AS GAMEPASSES'}</Text>
        </Pressable>"""
          if old not in s:
              raise SystemExit('store target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-gamepass-store.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/store.tsx .github/workflows/patch-gamepass-store.yml
          git commit -m "Expose full Gamepass catalog in store"
          git push
