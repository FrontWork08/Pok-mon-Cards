name: Patch team3 scroll performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-team3-scroll-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-team3-scroll-performance.py

      - name: Commit patch
        run: |
          rm .github/workflows/patch-team3-scroll-performance.yml
          rm scripts/patch-team3-scroll-performance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/team-battle/'[id].tsx' .github/workflows/patch-team3-scroll-performance.yml scripts/patch-team3-scroll-performance.py
          git commit -m "Virtualize team3 Pokemon selector"
          git push origin main
