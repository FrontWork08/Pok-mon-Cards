name: Force Legacy Android Upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-legacy-update.yml

permissions:
  contents: read

concurrency:
  group: force-legacy-android-v1.0.1
  cancel-in-progress: false

jobs:
  publish-legacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout v1.0.1 source
        uses: actions/checkout@v4
        with:
          ref: android-v1.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install mandatory v1.1.0 APK upgrade gate into legacy bundle
        shell: bash
        run: |
          cat > src/components/UpdatePrompt.tsx <<'EOF'
          import { useEffect, useState } from 'react';
          import { Linking, Modal, Platform, Pressable, StyleSheet, Text, View } from 'react-native';
          import { Ionicons } from '@expo/vector-icons';
          import { useSafeAreaInsets } from 'react-native-safe-area-context';
          import * as Updates from 'expo-updates';
          import { useAppTheme } from '@/theme/ThemeProvider';

          const APK_INSTALLER_URL = 'https://expo.dev/accounts/frontwork/projects/pokemon-cards/builds/ee391e3f-1e2b-4662-8d1e-c1acccba5960';

          export function UpdatePrompt() {
            const { colors } = useAppTheme();
            const insets = useSafeAreaInsets();
            const [opening, setOpening] = useState(false);
            const [checkingGateUpdate, setCheckingGateUpdate] = useState(false);
            const [errorText, setErrorText] = useState('');
            const mandatoryUpgrade = Platform.OS === 'android' && !__DEV__;

            useEffect(() => {
              if (!mandatoryUpgrade || !Updates.isEnabled) return;

              let cancelled = false;
              const refreshGateIfNeeded = async () => {
                try {
                  if (!cancelled) setCheckingGateUpdate(true);
                  const result = await Updates.checkForUpdateAsync();
                  if (!result.isAvailable || cancelled) return;
                  await Updates.fetchUpdateAsync();
                  if (!cancelled) await Updates.reloadAsync();
                } catch {
                  // A falha de uma checagem OTA nunca libera o APK antigo.
                  // O usuário ainda pode instalar a nova versão pelo botão abaixo.
                } finally {
                  if (!cancelled) setCheckingGateUpdate(false);
                }
              };

              void refreshGateIfNeeded();
              return () => { cancelled = true; };
            }, [mandatoryUpgrade]);

            async function openInstaller() {
              if (opening) return;
              setOpening(true);
              setErrorText('');
              try {
                await Linking.openURL(APK_INSTALLER_URL);
              } catch {
                setErrorText('Não foi possível abrir o instalador do novo APK. Verifique sua conexão e tente novamente.');
              } finally {
                setOpening(false);
              }
            }

            if (!mandatoryUpgrade) return null;

            return (
              <Modal visible transparent animationType="fade" statusBarTranslucent onRequestClose={() => {}}>
                <View style={styles.overlay}>
                  <View style={[styles.sheet, { backgroundColor: colors.surface, borderColor: colors.border, paddingBottom: Math.max(insets.bottom, 20) }]}>
                    <View style={[styles.iconWrap, { backgroundColor: colors.accentSoft }]}>
                      <Ionicons name="cloud-download-outline" size={30} color={colors.yellow} />
                    </View>
                    <Text style={[styles.eyebrow, { color: colors.yellow }]}>ATUALIZAÇÃO OBRIGATÓRIA</Text>
                    <Text style={[styles.title, { color: colors.text }]}>Trainer Collection 1.1.0</Text>
                    <Text style={[styles.body, { color: colors.muted }]}>
                      Esta versão foi encerrada. Para continuar jogando, instale o novo APK oficial do Trainer Collection.
                    </Text>
                    <View style={[styles.notice, { borderColor: colors.border }]}>
                      <Text style={[styles.noticeText, { color: colors.text }]}>O jogo permanece bloqueado neste APK antigo até você instalar a versão 1.1.0.</Text>
                    </View>
                    {checkingGateUpdate ? (
                      <Text style={[styles.syncText, { color: colors.muted }]}>Verificando correções desta tela…</Text>
                    ) : null}
                    {errorText ? <Text style={[styles.errorText, { color: colors.red }]}>{errorText}</Text> : null}
                    <Pressable disabled={opening} onPress={() => { void openInstaller(); }} style={({ pressed }) => [styles.primaryButton, { backgroundColor: colors.yellow, opacity: pressed || opening ? 0.8 : 1 }]}>
                      <Ionicons name="download-outline" size={20} color="#080808" />
                      <Text style={styles.primaryText}>{opening ? 'ABRINDO INSTALADOR…' : 'ATUALIZAR APK AGORA'}</Text>
                    </Pressable>
                    <Text style={[styles.footer, { color: colors.muted }]}>O OTA serve apenas para manter esta tela de bloqueio corrigida. A atualização do jogo exige o novo APK.</Text>
                  </View>
                </View>
              </Modal>
            );
          }

          const styles = StyleSheet.create({
            overlay: { flex: 1, justifyContent: 'center', paddingHorizontal: 18, backgroundColor: 'rgba(0,0,0,.84)' },
            sheet: { borderRadius: 28, borderWidth: 1, paddingTop: 26, paddingHorizontal: 20 },
            iconWrap: { width: 58, height: 58, borderRadius: 19, alignItems: 'center', justifyContent: 'center', alignSelf: 'center' },
            eyebrow: { fontSize: 10, fontWeight: '900', letterSpacing: 1.5, textAlign: 'center', marginTop: 15 },
            title: { fontSize: 24, lineHeight: 30, fontWeight: '900', textAlign: 'center', marginTop: 5 },
            body: { fontSize: 13, lineHeight: 20, textAlign: 'center', marginTop: 9 },
            notice: { marginTop: 18, borderWidth: 1, borderRadius: 15, paddingHorizontal: 13, paddingVertical: 12 },
            noticeText: { fontSize: 11, lineHeight: 16, fontWeight: '700', textAlign: 'center' },
            syncText: { marginTop: 10, fontSize: 10, lineHeight: 14, fontWeight: '700', textAlign: 'center' },
            errorText: { marginTop: 12, fontSize: 11, lineHeight: 16, fontWeight: '700', textAlign: 'center' },
            primaryButton: { height: 56, borderRadius: 16, marginTop: 20, flexDirection: 'row', gap: 9, alignItems: 'center', justifyContent: 'center' },
            primaryText: { color: '#080808', fontSize: 11, fontWeight: '900', letterSpacing: 0.5 },
            footer: { textAlign: 'center', fontSize: 10, lineHeight: 14, marginTop: 12 },
          });
          EOF

      - name: Load Expo environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment preview --path .env.local --non-interactive

      - name: Deliver mandatory APK gate to v1.0.1 runtime
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment preview --platform android --message "Legacy APK gate self-refreshes OTA corrections; APK upgrade remains mandatory" --non-interactive
