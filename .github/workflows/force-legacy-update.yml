name: Force Legacy Android Upgrade

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-legacy-update.yml

permissions:
  contents: read

concurrency:
  group: force-legacy-android-gates
  cancel-in-progress: false

jobs:
  publish-legacy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: android-v1.0.1
            label: v1.0.1
          - ref: android-v1.1.0
            label: v1.1.0
          - ref: android-v1.2.0
            label: v1.2.0

    steps:
      - name: Checkout ${{ matrix.label }} source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install OTA-first mandatory v1.2.1 upgrade gate
        shell: bash
        run: |
          cat > src/components/UpdatePrompt.tsx <<'EOF'
          import { useEffect, useState } from 'react';
          import { Linking, Modal, Platform, Pressable, StyleSheet, Text, View } from 'react-native';
          import { Ionicons } from '@expo/vector-icons';
          import { useSafeAreaInsets } from 'react-native-safe-area-context';
          import * as Updates from 'expo-updates';
          import { useAppTheme } from '@/theme/ThemeProvider';

          const OFFICIAL_DOWNLOAD_SITE = 'https://pokemon-cards-frontwork.expo.app/download/';

          export function UpdatePrompt() {
            const { colors } = useAppTheme();
            const insets = useSafeAreaInsets();
            const [opening, setOpening] = useState(false);
            const [gateReady, setGateReady] = useState(false);
            const [errorText, setErrorText] = useState('');
            const mandatoryUpgrade = Platform.OS === 'android' && !__DEV__;

            useEffect(() => {
              if (!mandatoryUpgrade) return;

              let cancelled = false;
              let fallbackTimer: ReturnType<typeof setTimeout> | null = null;

              const finishGateBootstrap = () => {
                if (!cancelled) setGateReady(true);
              };

              const refreshOtaFirst = async () => {
                if (!Updates.isEnabled) {
                  finishGateBootstrap();
                  return;
                }

                fallbackTimer = setTimeout(finishGateBootstrap, 6500);
                try {
                  const result = await Updates.checkForUpdateAsync();
                  if (cancelled) return;
                  if (result.isAvailable || result.isRollBackToEmbedded) {
                    const fetched = await Updates.fetchUpdateAsync();
                    if (cancelled) return;
                    if (fetched.isNew || fetched.isRollBackToEmbedded) {
                      await Updates.reloadAsync();
                      return;
                    }
                  }
                } catch {
                  // Native upgrade stays available even if OTA is temporarily offline.
                }
                finishGateBootstrap();
              };

              void refreshOtaFirst();
              return () => {
                cancelled = true;
                if (fallbackTimer) clearTimeout(fallbackTimer);
              };
            }, [mandatoryUpgrade]);

            async function openInstallerSite() {
              if (opening) return;
              setOpening(true);
              setErrorText('');
              try {
                await Linking.openURL(OFFICIAL_DOWNLOAD_SITE);
              } catch {
                setErrorText('Não foi possível abrir o site oficial de download. Verifique sua conexão e tente novamente.');
              } finally {
                setOpening(false);
              }
            }

            if (!mandatoryUpgrade || !gateReady) return null;

            return (
              <Modal visible transparent animationType="fade" statusBarTranslucent onRequestClose={() => {}}>
                <View style={styles.overlay}>
                  <View style={[styles.sheet, { backgroundColor: colors.surface, borderColor: colors.border, paddingBottom: Math.max(insets.bottom, 20) }]}>
                    <View style={[styles.iconWrap, { backgroundColor: colors.accentSoft }]}>
                      <Ionicons name="cloud-download-outline" size={30} color={colors.yellow} />
                    </View>
                    <Text style={[styles.eyebrow, { color: colors.yellow }]}>ATUALIZAÇÃO OBRIGATÓRIA</Text>
                    <Text style={[styles.title, { color: colors.text }]}>Trainer Collection 1.2.1</Text>
                    <Text style={[styles.body, { color: colors.muted }]}>Esta versão foi encerrada. Para continuar jogando, instale o APK 1.2.1 pelo site oficial do Trainer Collection.</Text>
                    <View style={[styles.notice, { borderColor: colors.border }]}>
                      <Text style={[styles.noticeText, { color: colors.text }]}>Antes desta tela aparecer, o app verifica e aplica silenciosamente qualquer correção OTA disponível para este APK.</Text>
                    </View>
                    {errorText ? <Text style={[styles.errorText, { color: colors.red }]}>{errorText}</Text> : null}
                    <Pressable disabled={opening} onPress={() => { void openInstallerSite(); }} style={({ pressed }) => [styles.primaryButton, { backgroundColor: colors.yellow, opacity: pressed || opening ? 0.8 : 1 }]}>
                      <Ionicons name="globe-outline" size={20} color="#080808" />
                      <Text style={styles.primaryText}>{opening ? 'ABRINDO SITE…' : 'ABRIR SITE E ATUALIZAR'}</Text>
                    </Pressable>
                    <Text style={[styles.footer, { color: colors.muted }]}>O botão abre somente a página oficial do Trainer Collection. O app não direciona mais o jogador para o GitHub.</Text>
                  </View>
                </View>
              </Modal>
            );
          }

          const styles = StyleSheet.create({
            overlay: { flex: 1, justifyContent: 'center', paddingHorizontal: 18, backgroundColor: 'rgba(0,0,0,.84)' },
            sheet: { borderRadius: 28, borderWidth: 1, paddingTop: 26, paddingHorizontal: 20 },
            iconWrap: { width: 58, height: 58, borderRadius: 19, alignItems: 'center', justifyContent: 'center', alignSelf: 'center' },
            eyebrow: { fontSize: 10, fontWeight: '900', letterSpacing: 1.5, textAlign: 'center', marginTop: 15 },
            title: { fontSize: 24, lineHeight: 30, fontWeight: '900', textAlign: 'center', marginTop: 5 },
            body: { fontSize: 13, lineHeight: 20, textAlign: 'center', marginTop: 9 },
            notice: { marginTop: 18, borderWidth: 1, borderRadius: 15, paddingHorizontal: 13, paddingVertical: 12 },
            noticeText: { fontSize: 11, lineHeight: 16, fontWeight: '700', textAlign: 'center' },
            errorText: { marginTop: 12, fontSize: 11, lineHeight: 16, fontWeight: '700', textAlign: 'center' },
            primaryButton: { height: 56, borderRadius: 16, marginTop: 20, flexDirection: 'row', gap: 9, alignItems: 'center', justifyContent: 'center' },
            primaryText: { color: '#080808', fontSize: 11, fontWeight: '900', letterSpacing: 0.5 },
            footer: { textAlign: 'center', fontSize: 10, lineHeight: 14, marginTop: 12 },
          });
          EOF

      - name: Load Expo environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment preview --path .env.local --non-interactive

      - name: Deliver OTA-first gate to ${{ matrix.label }} runtime
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --channel production --environment preview --platform android --message "${{ matrix.label }} gate - OTA first, then Trainer Collection 1.2.1 via official site" --non-interactive
