name: Apply isolated real-model 3D lab
"on":
  push:
    branches:
      - test/3d-real-models
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/3d-real-models
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-3d-real-lab.mjs
      - name: Commit generated patch
        run: |
          rm scripts/apply-3d-real-lab.mjs
          rm .github/workflows/apply-3d-real-lab.yml
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add app/admin-3d-lab.tsx src/components/AdaptiveBattleArena.tsx src/components/BattleArena3D.native.tsx src/services/pokemon3dModels.ts package.json scripts/apply-3d-real-lab.mjs .github/workflows/apply-3d-real-lab.yml
          git commit -m "feat: isolate real GLB tests in 3D lab"
          git push origin HEAD:test/3d-real-models
