name: Finish APK security site rollout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-apk-security-site.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch security page and release audits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('public/download/index.html')
          s = index.read_text()
          replacements = [
            ('<span>✓ APK assinado</span>', '<span>✓ Assinatura Android verificada</span>'),
            ('<p>Compare este código com o hash do arquivo baixado para confirmar que o APK não foi alterado.</p>', '<p>Compare este código com o hash do arquivo baixado para confirmar que o APK não foi alterado. A release também é conferida pelo Android <code>apksigner</code> antes de ser liberada.</p>'),
            ('          <div class="integrity-row"><span>Canal</span><strong>Android • Production oficial</strong></div>', '''          <div class="integrity-row"><span>Assinatura Android</span><strong id="release-signature">Verificando…</strong></div>
          <div class="integrity-row"><span>Package</span><strong id="release-package">Verificando…</strong></div>
          <div class="integrity-row"><span>Verificador</span><strong id="release-verifier">Verificando…</strong></div>
          <div class="integrity-row"><span>Verificado em</span><strong id="release-verified-date">Verificando…</strong></div>
          <p><strong>Fingerprint SHA-256 do certificado oficial</strong></p>
          <div class="hash-box">
            <code id="release-cert-hash">Aguardando verificação</code>
            <button id="copy-cert-hash" type="button" disabled>Copiar</button>
          </div>
          <div class="integrity-row"><span>Canal</span><strong>Android • Production oficial</strong></div>'''),
            ('<article><strong>Hash do APK</strong><p>Cada build oficial pode publicar seu SHA-256 para verificação independente.</p></article>', '<article><strong>Hash + assinatura</strong><p>O download só é liberado quando o SHA-256, a assinatura Android e o certificado oficial fixado estão consistentes.</p></article>'),
            ('<p>Porque o APK é instalado diretamente pelo navegador, fora da Play Store. Baixe somente pela página oficial e confira o SHA-256 publicado.</p>', '<p>Porque o APK é instalado diretamente pelo navegador, fora da Play Store. Esse aviso genérico pode aparecer mesmo quando o arquivo está íntegro. Esta página confere SHA-256, assinatura Android e certificado oficial antes de liberar o botão.</p>'),
            ('''          <details>
            <summary>Preciso baixar um APK novo para toda atualização?</summary>''', '''          <details>
            <summary>E se o Play Protect disser especificamente “app nocivo” ou mostrar o nome de uma ameaça?</summary>
            <p>Nesse caso, não force a instalação. Um alerta explícito de ameaça é diferente do aviso genérico de instalação externa. Avise o responsável pelo Trainer Collection para a release ser investigada e, se for falso positivo, contestada antes de continuar.</p>
          </details>
          <details>
            <summary>Preciso baixar um APK novo para toda atualização?</summary>'''),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'index.html anchor missing: {old[:100]}')
            s = s.replace(old, new, 1)
          index.write_text(s)

          package = Path('package.json')
          s = package.read_text()
          old = 'node scripts/full-game-audit.mjs"'
          new = 'node scripts/full-game-audit.mjs && node scripts/apk-security-audit.mjs"'
          if old not in s:
            raise SystemExit('package.json verify anchor missing')
          s = s.replace(old, new, 1)
          package.write_text(s)

          workflow = Path('.github/workflows/eas-update.yml')
          s = workflow.read_text()
          anchor = '      - scripts/regression-audit.mjs\n'
          if anchor not in s:
            raise SystemExit('eas-update.yml path anchor missing')
          if '      - scripts/apk-security-audit.mjs\n' not in s:
            s = s.replace(anchor, anchor + '      - scripts/apk-security-audit.mjs\n', 1)
          workflow.write_text(s)
          PY

      - name: Run static APK security audit
        run: node scripts/apk-security-audit.mjs

      - name: Remove temporary workflow
        run: rm .github/workflows/finish-apk-security-site.yml

      - name: Commit verified download experience
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/index.html package.json .github/workflows/eas-update.yml .github/workflows/finish-apk-security-site.yml
          git commit -m "security: gate APK download on verified signature"
          git push
