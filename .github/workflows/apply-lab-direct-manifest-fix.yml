name: Apply direct 3D lab manifest fix

on:
  push:
    branches:
      - fix/3d-lab-direct-models
    paths:
      - .github/workflows/apply-lab-direct-manifest-fix.yml
      - scripts/patch-lab-direct-models.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3d-lab-direct-models
      - name: Apply patch
        run: python scripts/patch-lab-direct-models.py
      - name: Validate
        run: |
          npm ci
          npm run verify
      - name: Commit fix
        run: |
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add src/services/pokemon3dModels.ts app/admin-3d-lab.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: load built-in 3D lab models directly"
          git push origin HEAD:fix/3d-lab-direct-models
