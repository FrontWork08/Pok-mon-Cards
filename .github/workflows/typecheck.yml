name: TypeScript Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Dependency audit report
        run: |
          echo "=== RUNTIME ONLY ==="
          npm audit --omit=dev --json || true
          echo "=== FULL TREE ==="
          npm audit --json || true
      - run: npm run verify
