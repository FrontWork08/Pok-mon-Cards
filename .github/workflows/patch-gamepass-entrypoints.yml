name: Patch Gamepass Entrypoints
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch entrypoints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          store=Path('app/store.tsx')
          s=store.read_text()
          s=s.replace("onPress={()=>router.push('/auto-open')} style={[styles.gamepassButton", "onPress={()=>router.push(boosterPerks?.autoOpenGamepass?'/auto-open':'/gamepasses')} style={[styles.gamepassButton", 1)
          s=s.replace("boosterPerks?.autoOpenGamepass?'play':'information-circle'", "boosterPerks?.autoOpenGamepass?'play':'diamond'", 1)
          s=s.replace("boosterPerks?.autoOpenGamepass?'ABRIR AUTO BOOSTER':'COMO COMPRAR'", "boosterPerks?.autoOpenGamepass?'ABRIR AUTO BOOSTER':'VER TODAS AS GAMEPASSES'", 1)
          store.write_text(s)
          auto=Path('app/auto-open.tsx')
          a=auto.read_text()
          a=a.replace("onPress={()=>router.push('/store')} style={[styles.storeLink", "onPress={()=>router.push('/gamepasses')} style={[styles.storeLink", 1)
          a=a.replace('VER GAMEPASS NA TRAINER SHOP','VER TODAS AS GAMEPASSES',1)
          auto.write_text(a)
          PY
          rm -f scripts/.trigger-gamepass-entrypoints
          rm -f .github/workflows/patch-gamepass-entrypoints.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expose Gamepass catalog from store and Auto Booster"
          git push
