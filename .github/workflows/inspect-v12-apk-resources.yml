name: Inspect Trainer Collection 1.2 APK resources

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/inspect-v12-apk-resources.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Query successful EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@23.2.0 build:view 8b34e33f-7c0d-4851-b8ad-8e5654b6dd01 --json > build.json
          node - <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('build.json','utf8'));
          const url = b?.artifacts?.buildUrl ?? b?.artifacts?.applicationArchiveUrl;
          if (!url) throw new Error('No APK artifact URL in successful EAS build metadata');
          fs.appendFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`);
          console.log(JSON.stringify({id:b.id,status:b.status,appVersion:b.appVersion,appBuildVersion:b.appBuildVersion,artifacts:b.artifacts}, null, 2));
          NODE

      - name: Download and inspect APK resource paths
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "$APK_URL" -o /tmp/tc-v12.apk
          unzip -l /tmp/tc-v12.apk > apk-files.txt
          echo '--- tc_ matches ---'
          grep -i 'tc_' apk-files.txt || true
          echo '--- res/raw matches ---'
          grep -i 'res/raw' apk-files.txt || true
          echo '--- notification/audio matches ---'
          grep -Ei 'notification|sound|\.wav|\.mp3|\.ogg' apk-files.txt || true
          sha256sum /tmp/tc-v12.apk

      - name: Upload listing
        uses: actions/upload-artifact@v4
        with:
          name: v12-apk-resource-listing
          path: |
            build.json
            apk-files.txt
          retention-days: 7
