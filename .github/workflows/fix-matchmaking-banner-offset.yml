name: Fix matchmaking banner offset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-matchmaking-banner-offset.yml
      - scripts/patch-matchmaking-banner-offset.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch matchmaking banner layout
        run: python scripts/patch-matchmaking-banner-offset.py
      - name: Install dependencies
        run: npm ci
      - name: Verify project
        run: npm run verify
      - name: Verify offset contract
        shell: bash
        run: |
          grep -q "bottom: matchmakingBottom" app/_layout.tsx
          grep -q "Math.max(bottomNavHeight + 10" app/_layout.tsx
          grep -q "onLayout={(event) =>" app/_layout.tsx
      - name: Commit tested layout fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/_layout.tsx
          git diff --cached --check
          git commit -m 'fix: keep matchmaking banner above bottom navigation'
          git push
