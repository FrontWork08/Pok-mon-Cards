name: Fix battle and notification reliability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-battle-notification-reliability.yml
      - scripts/patch-battle-reliability.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch battle reliability
        run: python scripts/patch-battle-reliability.py
      - name: Install dependencies
        run: npm ci
      - name: Verify project
        run: npm run verify
      - name: Commit tested reliability fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/battle/'[id].tsx' app/team-battle/'[id].tsx' src/services/battles.ts src/services/teamBattles.ts supabase/functions/battle-action/index.ts supabase/functions/team-battle-action/index.ts supabase/migrations/20260904235639_fix_team3_attack_timeout_and_fast_notifications.sql scripts/battle-reliability-audit.mjs package.json
          git diff --cached --check
          git commit -m 'fix: harden battle attacks and notification latency'
          git push
