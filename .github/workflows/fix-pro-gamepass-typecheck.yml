name: Fix Pro Gamepass Typecheck
on:
  push:
    paths:
      - .github/workflows/fix-pro-gamepass-typecheck.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/guild-pro.tsx')
          s=p.read_text().replace("m.baseRole==='leader'?'crown':m.baseRole==='officer'?'shield':'person'", "m.baseRole==='leader'?'trophy':m.baseRole==='officer'?'shield':'person'")
          p.write_text(s)
          p=Path('app/battle-style-pass.tsx')
          s=p.read_text().replace("opacity:working?.65:1", "opacity:working ? .65 : 1")
          p.write_text(s)
          PY
          rm .github/workflows/fix-pro-gamepass-typecheck.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Pro Gamepass typecheck"
          git pull --rebase origin main
          git push
