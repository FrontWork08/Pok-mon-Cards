name: Publish Final Beta Migration Update

on:
  push:
    branches:
      - beta-force-update

permissions:
  contents: read

concurrency:
  group: beta-force-update
  cancel-in-progress: true

jobs:
  update-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Beta runtime
        uses: actions/checkout@v4
        with:
          ref: beta-force-update

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Beta runtime
        run: |
          node -e "const a=require('./app.json').expo;if(a.version!=='0.1.1')throw new Error('Expected Beta runtime 0.1.1');console.log('Beta runtime',a.version)"
          npx tsc --noEmit

      - name: Publish final Beta OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel preview --platform android --environment preview --message "Final Beta 0.1.1 migration gate" --non-interactive
