name: Fix daily reward and home bugs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-daily-reward-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python scripts/temp-fix-daily-home.py
      - name: Remove temporary files
        run: rm .github/workflows/fix-daily-reward-home.yml scripts/temp-fix-daily-home.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(tabs)'/index.tsx src/services/home.ts scripts/full-game-audit.mjs .github/workflows/fix-daily-reward-home.yml scripts/temp-fix-daily-home.py
          git commit -m "Fix duplicate daily reward and tournament home summary"
          git push
