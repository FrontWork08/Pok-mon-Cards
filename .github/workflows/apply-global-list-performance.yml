name: Apply global list performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-global-list-performance.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply shared performance props
        run: python scripts/apply-global-list-performance.py

      - name: Commit rollout
        run: |
          rm .github/workflows/apply-global-list-performance.yml
          rm scripts/apply-global-list-performance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src .github/workflows/apply-global-list-performance.yml scripts/apply-global-list-performance.py
          git commit -m "Apply virtualized list performance globally"
          git push origin main
