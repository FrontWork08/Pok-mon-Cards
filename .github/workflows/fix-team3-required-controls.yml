name: Fix Team 3x3 required controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-team3-required-controls.yml
      - scripts/patch-team3-controls.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch Team 3x3 controls
        run: python scripts/patch-team3-controls.py
      - name: Install dependencies
        run: npm ci
      - name: Verify project and Team 3x3 controls
        run: npm run verify
      - name: Commit tested Team 3x3 controls
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/team-battle/'[id].tsx' src/battles/teamSelection.ts scripts/team3-controls-audit.mjs package.json supabase/migrations/20260904233403_team3_forfeit_respects_team_selection.sql
          git diff --cached --check
          git commit -m 'fix: add required controls to Team 3x3'
          git push
