name: Apply lightweight GLB color fix

on:
  push:
    branches:
      - test/3d-original-species-models
    paths:
      - .github/workflows/apply-original-glb-color-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/3d-original-species-models
      - name: Write vertex colors directly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-original-3d-lab-assets.py')
          text = path.read_text()
          old = "mesh.visual.face_colors = np.tile(np.array(rgba, dtype=np.uint8), (len(mesh.faces), 1))"
          new = "mesh.visual.vertex_colors = np.tile(np.array(rgba, dtype=np.uint8), (len(mesh.vertices), 1))"
          if old not in text:
              raise SystemExit('expected color assignment not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add scripts/generate-original-3d-lab-assets.py
          git commit -m "fix: write GLB vertex colors without scipy"
          git push origin HEAD:test/3d-original-species-models
