name: Diagnose Trainer Collection 1.2 Android bundle

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/v12-android-bundle-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 1.2 candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Reproduce Android Metro bundle
        env:
          EXPO_NO_DOTENV: "1"
          CI: "1"
        run: npx expo export --platform android --output-dir dist-android --clear

      - name: Query failed EAS build metadata
        if: always()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas-cli build:view 9d522e90-94b6-43d6-9a1e-2a75d90c33cf --json > eas-build.json || true
            cat eas-build.json || true
          fi

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-android-bundle-diagnostic
          path: |
            eas-build.json
            dist-android/**
          if-no-files-found: ignore
          retention-days: 7
