name: Verify current APK from build artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-apk-artifact.yml

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download retained official APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trainer-apk
          gh run download 33292077907 --repo "$GITHUB_REPOSITORY" --name Trainer-Collection-Android --dir /tmp/trainer-apk
          APK_PATH="$(find /tmp/trainer-apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "APK not found in retained artifact"
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh "$APK_PATH"

      - name: Verify SHA-256 and Android signature
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          ACTUAL_SHA="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "Expected SHA-256: $EXPECTED_SHA"
          echo "Actual SHA-256:   $ACTUAL_SHA"
          if [[ "${ACTUAL_SHA,,}" != "${EXPECTED_SHA,,}" ]]; then
            echo "APK SHA-256 mismatch"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "apksigner not found"
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apksigner-output.txt

          node <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('/tmp/apksigner-output.txt', 'utf8');
          const releasePath = 'public/download/release.json';
          const trustedPath = 'public/download/trusted-signing-cert.json';
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          const certMatch = output.match(/Signer #1 certificate SHA-256 digest:\s*([0-9a-f:]+)/i);
          if (!certMatch) throw new Error('Could not read signing certificate SHA-256 from apksigner');
          const certSha256 = certMatch[1].replace(/:/g, '').toLowerCase();
          if (!/^[0-9a-f]{64}$/.test(certSha256)) throw new Error('Invalid signing certificate SHA-256');
          const subjectMatch = output.match(/Signer #1 certificate DN:\s*(.+)/i);
          const certSubject = subjectMatch ? subjectMatch[1].trim() : null;
          const scheme = (n) => new RegExp(`Verified using v${n} scheme[^:]*:\\s*(true|false)`, 'i').exec(output)?.[1]?.toLowerCase() === 'true';

          if (fs.existsSync(trustedPath)) {
            const trusted = JSON.parse(fs.readFileSync(trustedPath, 'utf8'));
            const trustedSha = String(trusted.certificateSha256 || '').replace(/:/g, '').toLowerCase();
            if (trustedSha !== certSha256) throw new Error('Signing certificate does not match pinned official certificate');
          } else {
            fs.writeFileSync(trustedPath, JSON.stringify({
              appName: 'Trainer Collection',
              packageName: 'com.frontwork.pokemoncards',
              certificateSha256: certSha256,
              certificateSubject: certSubject,
              pinnedAt: new Date().toISOString(),
              source: 'Official v1.0.1 build artifact verified with Android apksigner'
            }, null, 2) + '\n');
          }

          release.packageName = 'com.frontwork.pokemoncards';
          release.verification = {
            sha256Verified: true,
            signatureVerified: true,
            certificateSha256: certSha256,
            certificateSubject: certSubject,
            signerMatchesTrustedCertificate: true,
            verifiedAt: new Date().toISOString(),
            verifier: 'Android apksigner',
            schemes: { v1: scheme(1), v2: scheme(2), v3: scheme(3), v4: scheme(4) }
          };
          fs.writeFileSync(releasePath, JSON.stringify(release, null, 2) + '\n');
          NODE

      - name: Remove temporary workflow and commit security evidence
        shell: bash
        run: |
          rm .github/workflows/verify-current-apk-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/release.json public/download/trusted-signing-cert.json .github/workflows/verify-current-apk-artifact.yml
          git commit -m "security: pin verified Android signing certificate"
          git push
