name: Prepare Native Camera Lockfile

on:
  push:
    branches:
      - feature/v1.0.1-native-camera
    paths:
      - package.json
      - .github/workflows/prepare-camera-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.1-native-camera
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate compatible lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync camera lockfile"
          git push origin HEAD:feature/v1.0.1-native-camera
