name: Apply Sketchfab card
on:
  push:
    branches: [feat/sketchfab-owner-integration]
    paths: [.github/workflows/apply-sketchfab-card.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sketchfab-owner-integration
      - name: Wire owner Sketchfab card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/admin-3d-lab.tsx')
          s = p.read_text()
          imp = "import { Screen } from '@/components/Screen';\n"
          add = imp + "import { SketchfabIntegrationCard } from '@/components/admin/SketchfabIntegrationCard';\n"
          if 'SketchfabIntegrationCard' not in s:
              if imp not in s: raise SystemExit('Screen import anchor not found')
              s = s.replace(imp, add, 1)
          anchor = "    <View style={styles.probeGrid}>"
          if '<SketchfabIntegrationCard />' not in s:
              if anchor not in s: raise SystemExit('probe grid anchor not found')
              s = s.replace(anchor, "    <SketchfabIntegrationCard />\n\n" + anchor, 1)
          p.write_text(s)
          PY
          rm .github/workflows/apply-sketchfab-card.yml
      - name: Commit patch and remove workflow
        run: |
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add app/admin-3d-lab.tsx .github/workflows/apply-sketchfab-card.yml
          git commit -m "feat: show Sketchfab integration in 3D lab"
          git push origin HEAD:feat/sketchfab-owner-integration
