name: Validate Same-Site APK Stream

on:
  push:
    branches:
      - fix/same-site-apk-stream
    paths:
      - .github/workflows/same-site-apk-preview.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Prepare artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py
      - name: Verify project
        run: npm run verify
      - name: Load production environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment production --path .env.local --non-interactive
      - name: Export server web build
        run: |
          npx expo export --platform web
          test -d dist/server
      - name: Deploy preview server
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --alias same-site-download-test --environment production --dev-domain pokemon-cards-frontwork --non-interactive
      - name: Verify same-site APK streaming
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://pokemon-cards-frontwork--same-site-download-test.expo.app"
          ARCHIVE="$(node -p "require('./public/download/release.json').archiveUrl")"
          curl --fail --location --retry 5 --retry-delay 2 --range 0-1048575 -D /tmp/site-headers.txt "$SITE/download-apk" -o /tmp/site-chunk.bin
          curl --fail --location --retry 5 --retry-delay 2 --range 0-1048575 "$ARCHIVE" -o /tmp/archive-chunk.bin
          test "$(stat -c%s /tmp/site-chunk.bin)" -gt 1000000
          [[ "$(sha256sum /tmp/site-chunk.bin | awk '{print $1}')" == "$(sha256sum /tmp/archive-chunk.bin | awk '{print $1}')" ]]
          grep -qi 'content-type: application/vnd.android.package-archive' /tmp/site-headers.txt
          grep -qi 'content-disposition: attachment; filename="Trainer-Collection-v1.3.0.apk"' /tmp/site-headers.txt
          echo "Same-site APK stream verified on EAS Hosting preview."
