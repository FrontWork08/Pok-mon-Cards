name: Fix Trainer Collection 1.2 Three Android bundle

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/fix-v12-three-babel.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.2-adventure-3d
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Babel 7 static class block transform
        run: |
          npm install --save-dev @babel/plugin-transform-class-static-block@7
          cat > babel.config.js <<'EOF'
          module.exports = function (api) {
            api.cache(true);
            return {
              presets: ['babel-preset-expo'],
              plugins: ['@babel/plugin-transform-class-static-block'],
            };
          };
          EOF

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify Android Metro bundle
        env:
          EXPO_NO_DOTENV: "1"
          CI: "1"
        run: npx expo export --platform android --output-dir dist-android --clear

      - name: Verify TypeScript and release contracts
        run: npm run verify

      - name: Commit Android bundle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add babel.config.js package.json package-lock.json
          git commit -m "fix: transform Three static class blocks on Android"
          git push origin HEAD:feature/v1.2-adventure-3d
