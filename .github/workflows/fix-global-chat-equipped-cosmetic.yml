name: Fix global chat equipped cosmetic theme

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-global-chat-equipped-cosmetic.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply cosmetic message theme fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: anchor not found: {old[:120]!r}')
              p.write_text(text.replace(old,new,count))

          p='src/components/GlobalChatHomeCard.tsx'
          replace(p,
            "import { TrainerAvatar } from '@/components/TrainerAvatar';",
            "import { TrainerAvatar } from '@/components/TrainerAvatar';\nimport { CompactTrainerBanner } from '@/components/CompactTrainerBanner';")
          replace(p,
            "            const mine = message.playerId === userId;\n            return (",
            "            const mine = message.playerId === userId;\n            const hasEquippedTheme = Boolean(message.frameId || message.backgroundId);\n            return (")
          replace(p,
            "                    frameId={message.frameId}\n                    backgroundId={message.backgroundId}\n                    size={31}",
            "                    size={31}")
          replace(p,
            "                <View style={[styles.bubble, { backgroundColor: mine ? colors.accentSoft : colors.surfaceAlt, borderColor: mine ? colors.accent : colors.border }]}>\n",
            "                <CompactTrainerBanner\n                  frameId={message.frameId}\n                  backgroundId={message.backgroundId}\n                  fallbackColor={colors.accent}\n                  style={styles.bubbleTheme}\n                >\n                  <View style={[styles.bubble, {\n                    backgroundColor: hasEquippedTheme ? 'rgba(8,10,18,0.76)' : (mine ? colors.accentSoft : colors.surfaceAlt),\n                    borderColor: hasEquippedTheme ? 'transparent' : (mine ? colors.accent : colors.border),\n                  }]}>\n")
          replace(p,
            "                  </Pressable>\n                </View>\n              </View>",
            "                  </Pressable>\n                  </View>\n                </CompactTrainerBanner>\n              </View>")
          replace(p,
            "  bubble:{flex:1,borderRadius:14,borderWidth:1,paddingHorizontal:10,paddingVertical:8},",
            "  bubbleTheme:{flex:1,borderRadius:16},\n  bubble:{flex:1,borderRadius:14,borderWidth:1,paddingHorizontal:10,paddingVertical:8},")

          # Expand CompactTrainerBanner so every currently shipped cosmetic family
          # has its own palette instead of falling back to the app accent color.
          p='src/components/CompactTrainerBanner.tsx'
          replace(p,
            "  if(key.includes('galaxy')) return {\n    premium:true,galaxy:true,tier:5,primary:'#8B5CFF',secondary:'#55E6FF',tertiary:'#E056FD',background:'#151027',\n  };",
            "  if(key.includes('galaxy')) return {\n    premium:true,galaxy:true,tier:5,primary:'#8B5CFF',secondary:'#55E6FF',tertiary:'#E056FD',background:'#151027',\n  };\n  if(key.includes('aurora')||key.includes('prism')||key.includes('cosmetic_pass_nebula')) return {\n    premium:true,galaxy:true,tier:4,primary:'#8B5CFF',secondary:'#55E6FF',tertiary:'#C493FF',background:'#120D2B',\n  };\n  if(key.includes('trainer_vip')) return {\n    premium:true,galaxy:false,tier:4,primary:'#FFD447',secondary:'#8B5CFF',tertiary:'#FFF0A8',background:'#15102B',\n  };\n  if(key.includes('kanto')) return {\n    premium:true,galaxy:false,tier:3,primary:'#E84D5B',secondary:'#FF9A71',tertiary:'#FFD0A8',background:'#35151B',\n  };\n  if(key.includes('johto')) return {\n    premium:true,galaxy:false,tier:3,primary:'#F0C84B',secondary:'#FFF0A8',tertiary:'#FF9F2F',background:'#30280E',\n  };\n  if(key.includes('platinum')) return {\n    premium:true,galaxy:false,tier:3,primary:'#9CB6FF',secondary:'#D7E2FF',tertiary:'#6A7CFF',background:'#17203C',\n  };\n  if(key.includes('midnight')) return {\n    premium:true,galaxy:false,tier:3,primary:'#586A9E',secondary:'#8EA3E8',tertiary:'#AFA8FF',background:'#0B1020',\n  };\n  if(key.includes('collector')) return {\n    premium:true,galaxy:false,tier:3,primary:'#65D894',secondary:'#A7F3C7',tertiary:'#55E6FF',background:'#123023',\n  };\n  if(key.includes('guild')) return {\n    premium:true,galaxy:false,tier:3,primary:'#68D9FF',secondary:'#B7EEFF',tertiary:'#6A7CFF',background:'#102C3A',\n  };\n  if(key.includes('classic')) return {\n    premium:true,galaxy:false,tier:3,primary:'#FFD447',secondary:'#FFF0A8',tertiary:'#8EE7FF',background:'#111827',\n  };")
          replace(p,
            "  return {\n    premium:false,galaxy:false,tier:2,primary:fallback,secondary:fallback,tertiary:fallback,background:'transparent',\n  };",
            "  if(frame||background) return {\n    premium:true,galaxy:false,tier:2,primary:'#6A7CFF',secondary:'#55D9FF',tertiary:'#AFA8FF',background:'#111827',\n  };\n  return {\n    premium:false,galaxy:false,tier:2,primary:fallback,secondary:fallback,tertiary:fallback,background:'transparent',\n  };")

          p='scripts/trainer-identity-audit.mjs'
          replace(p,
            "['src/components/GlobalChatHomeCard.tsx', ['getProfileAvatarUrl(message.avatarPath', 'frameId={message.frameId}', 'backgroundId={message.backgroundId}']],",
            "['src/components/GlobalChatHomeCard.tsx', ['getProfileAvatarUrl(message.avatarPath', 'CompactTrainerBanner', 'frameId={message.frameId}', 'backgroundId={message.backgroundId}', 'hasEquippedTheme', \"borderColor: hasEquippedTheme ? 'transparent'\"]],")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify full project
        run: npm run verify

      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GlobalChatHomeCard.tsx src/components/CompactTrainerBanner.tsx scripts/trainer-identity-audit.mjs
          git diff --cached --check
          git commit -m 'fix: use equipped cosmetic on global chat messages'
          git push
