name: Apply original GLB lab UI

on:
  push:
    branches:
      - test/3d-original-species-models
    paths:
      - .github/workflows/apply-3d-builtin-lab-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/3d-original-species-models
      - name: Wire built-in model import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin-3d-lab.tsx')
          text = path.read_text()

          old = "import { ingestPokemon3DLabModel, type Pokemon3DLabIngestResult } from '@/services/pokemon3dLab';\n"
          new = old + "import { ingestOriginal3DLabModels } from '@/services/pokemon3dLabBuiltins';\n"
          if old not in text: raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)

          old = "  const [lastImport, setLastImport] = useState<Pokemon3DLabIngestResult | null>(null);\n"
          new = old + "  const [builtinImporting, setBuiltinImporting] = useState(false);\n  const [builtinImportError, setBuiltinImportError] = useState<string | null>(null);\n  const [builtinImportDone, setBuiltinImportDone] = useState(0);\n"
          if old not in text: raise SystemExit('state anchor missing')
          text = text.replace(old, new, 1)

          anchor = "  async function startRenderer() {\n"
          fn = """  async function importOriginalLabModels() {\n    if (builtinImporting) return;\n    setBuiltinImporting(true);\n    setBuiltinImportError(null);\n    setBuiltinImportDone(0);\n    try {\n      const results = await ingestOriginal3DLabModels();\n      setBuiltinImportDone(results.length);\n      invalidatePokemon3DManifest(undefined, 'lab');\n      await probeModels();\n      setRendererState('idle');\n      setArenaComponent(null);\n      setRendererError(null);\n    } catch (error) {\n      setBuiltinImportError(error instanceof Error ? error.message : 'Falha ao importar os modelos originais do laboratório');\n    } finally {\n      setBuiltinImporting(false);\n    }\n  }\n\n"""
          if anchor not in text: raise SystemExit('function anchor missing')
          text = text.replace(anchor, fn + anchor, 1)

          anchor = "      {lastImport ? <Text style={[styles.note,{color:'#65D894'}]}>Último import: #{lastImport.pokemon_id} • v{lastImport.version} • {(lastImport.byte_size/1024/1024).toFixed(2)} MB • {lastImport.inspection.meshCount} mesh(es) • {lastImport.inspection.animationNames.length} animação(ões)</Text> : null}\n"
          block = anchor + "      <Text style={[styles.note,{color:'#BDA8FF'}]}>Teste recomendado: modelos low-poly originais do projeto, reconhecíveis por espécie, sem arquivos extraídos de jogos. Eles continuam exclusivos da forma LAB.</Text>\n      {builtinImportError ? <Text selectable style={[styles.note,{color:'#FF8290'}]}>{builtinImportError}</Text> : null}\n      {builtinImportDone === 3 ? <Text style={[styles.note,{color:'#65D894'}]}>3/3 modelos originais validados e registrados no LAB.</Text> : null}\n      <Pressable onPress={() => void importOriginalLabModels()} disabled={builtinImporting} style={[styles.primary,{backgroundColor:builtinImporting?'#5C5870':'#BDA8FF'},builtinImporting&&styles.disabled]}><Ionicons name={builtinImporting?'hourglass-outline':'layers-outline'} size={18} color={builtinImporting?'#FFF':'#161126'}/><Text style={[styles.primaryText,{color:builtinImporting?'#FFF':'#161126'}]}>{builtinImporting?'VALIDANDO 3 MODELOS…':'IMPORTAR 3 MODELOS ORIGINAIS DE TESTE'}</Text></Pressable>\n"
          if anchor not in text: raise SystemExit('UI anchor missing')
          text = text.replace(anchor, block, 1)

          path.write_text(text)
          PY
      - name: Commit UI integration
        run: |
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add app/admin-3d-lab.tsx
          git commit -m "test: add one-tap import for original 3D lab models"
          git push origin HEAD:test/3d-original-species-models
