name: Build Trainer Collection 1.2 RC

# RC closed after build 14 passed. Kept inert until temporary workflow cleanup.
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/build-v12-rc.yml

permissions:
  contents: read

concurrency:
  group: trainer-collection-v12-rc
  cancel-in-progress: true

jobs:
  rc:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "RC 1.2.0 build 14 already verified; no additional cloud build required."
