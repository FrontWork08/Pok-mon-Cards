name: SDK 57 Native Validation

on:
  push:
    branches:
      - native/sdk57-upgrade
  pull_request:
    branches:
      - main

concurrency:
  group: sdk57-native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'native/sdk57-upgrade' || github.ref == 'refs/heads/native/sdk57-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked SDK 57 graph
        run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor@latest
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Full Trainer Collection verification
        run: npm run verify
      - name: Resolve public Expo config
        run: |
          npx expo config --type public > /tmp/expo-config.txt
          grep -q '1.3.0' /tmp/expo-config.txt
      - name: Generate Android native project
        run: |
          npx expo prebuild --platform android --clean --no-install
          grep -q 'com.frontwork.pokemoncards' android/app/build.gradle
          grep -q 'pokemon-cards-frontwork.expo.app' android/app/src/main/AndroidManifest.xml
      - name: Export Web bundle
        run: npx expo export --platform web
