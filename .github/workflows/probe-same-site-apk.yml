name: Probe Same-Site APK Preview

on:
  push:
    branches:
      - fix/same-site-apk-stream
    paths:
      - .github/workflows/probe-same-site-apk.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for EAS alias propagation
        run: sleep 20
      - name: Probe immutable deployment and alias
        shell: bash
        run: |
          set +e
          for URL in             "https://pokemon-cards-frontwork--7sem3p1brr.expo.app/download-apk"             "https://pokemon-cards-frontwork--same-site-download-test.expo.app/download-apk"; do
            echo "==== $URL ===="
            curl -sS -L --range 0-1023 -D - "$URL" -o /tmp/probe.bin
            echo "curl_status=$?"
            echo "bytes=$(stat -c%s /tmp/probe.bin 2>/dev/null || echo 0)"
            xxd -l 32 /tmp/probe.bin 2>/dev/null || true
          done
