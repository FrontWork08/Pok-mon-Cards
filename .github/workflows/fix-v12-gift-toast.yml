name: Restore gift notification toast

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/fix-v12-gift-toast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2-adventure-3d
          fetch-depth: 0

      - name: Restore special store gift toast
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app/_layout.tsx')
          s = p.read_text()
          old = '''      {liveNotification && !maintenanceBlocked ? (\n        <Pressable onPress={openLiveNotification} style={[styles.notificationToast,{top:Math.max(insets.top,8)+64,backgroundColor:colors.surface,borderColor:colors.yellow}]}>\n          <View style={[styles.notificationIcon,{backgroundColor:colors.yellow}]}><Text style={styles.notificationIconText}>!</Text></View>\n          <View style={styles.notificationCopy}><Text style={[styles.notificationTitle,{color:colors.text}]} numberOfLines={1}>{liveNotification.title}</Text><Text style={[styles.notificationBody,{color:colors.muted}]} numberOfLines={2}>{liveNotification.body}</Text></View>\n        </Pressable>\n      ) : null}'''
          new = '''      {liveNotification && !maintenanceBlocked ? (\n        <Pressable\n          onPress={openLiveNotification}\n          style={[\n            styles.notificationToast,\n            liveNotification.type === 'store_gift' ? styles.giftNotificationToast : null,\n            {\n              top: Math.max(insets.top, 8) + 64,\n              backgroundColor: liveNotification.type === 'store_gift' ? '#2A1D08' : colors.surface,\n              borderColor: liveNotification.type === 'store_gift' ? '#F5C451' : colors.yellow,\n            },\n          ]}\n        >\n          <View style={[\n            styles.notificationIcon,\n            liveNotification.type === 'store_gift' ? styles.giftNotificationIcon : null,\n            { backgroundColor: colors.yellow },\n          ]}>\n            <Text style={liveNotification.type === 'store_gift' ? styles.giftNotificationEmoji : styles.notificationIconText}>\n              {liveNotification.type === 'store_gift' ? '🎁' : '!'}\n            </Text>\n          </View>\n          <View style={styles.notificationCopy}>\n            <Text style={[styles.notificationTitle,{color:colors.text}]} numberOfLines={1}>{liveNotification.title}</Text>\n            <Text style={[styles.notificationBody,{color:liveNotification.type === 'store_gift' ? '#F7DF9A' : colors.muted}]} numberOfLines={2}>{liveNotification.body}</Text>\n          </View>\n        </Pressable>\n      ) : null}'''
          if old not in s:
              raise SystemExit('notification toast source block not found')
          s = s.replace(old, new, 1)
          style_old = "  notificationIconText:{color:'#07111F',fontSize:16,fontWeight:'900'},\n  notificationCopy:{flex:1,minWidth:0},"
          style_new = "  notificationIconText:{color:'#07111F',fontSize:16,fontWeight:'900'},\n  giftNotificationToast:{borderWidth:2,shadowOpacity:.5,shadowRadius:22},\n  giftNotificationIcon:{width:38,height:38,borderRadius:14},\n  giftNotificationEmoji:{fontSize:22,lineHeight:27},\n  notificationCopy:{flex:1,minWidth:0},"
          if style_old not in s:
              raise SystemExit('notification style anchor not found')
          s = s.replace(style_old, style_new, 1)
          p.write_text(s)
          PY

      - name: Verify gift regression contract and typecheck
        run: |
          npm ci
          node scripts/regression-audit.mjs
          npx tsc --noEmit

      - name: Commit gift toast restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_layout.tsx
          git commit -m "fix: restore special received gift notification toast"
          git push origin HEAD:feature/v1.2-adventure-3d
