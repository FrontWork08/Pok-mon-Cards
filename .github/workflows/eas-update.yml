name: Publish Production Update

# Trainer Collection 1.2 production deploy; retry after verified APK metadata repair.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - src/**
      - assets/**
      - public/**
      - app.json
      - package.json
      - package-lock.json
      - scripts/generate-trainer-assets.py
      - scripts/project-audit.mjs
      - scripts/regression-audit.mjs
      - scripts/apk-security-audit.mjs
      - scripts/trainer-identity-audit.mjs
      - scripts/battle-lab-filter-audit.mjs
      - scripts/native-11-audit.mjs
      - .github/workflows/eas-update.yml

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify OTA/native integrity
        run: npm run verify

      - name: Load Expo production environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment production --path .env.local --non-interactive

      - name: Export web app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo export --platform web

      - name: Deploy web app to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --prod --environment production --dev-domain pokemon-cards-frontwork --non-interactive

      - name: Publish Android update to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment production --platform android --message "Trainer Collection production $GITHUB_SHA" --non-interactive
