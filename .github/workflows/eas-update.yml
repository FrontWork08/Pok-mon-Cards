name: Publish Production Update

# Trainer Collection production deploy. Web/OTA updates validate the currently
# verified GitHub Release APK before publishing the official page and Android OTA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - src/**
      - assets/**
      - public/**
      - app.json
      - package.json
      - package-lock.json
      - scripts/generate-trainer-assets.py
      - scripts/project-audit.mjs
      - scripts/regression-audit.mjs
      - scripts/apk-security-audit.mjs
      - scripts/trainer-identity-audit.mjs
      - scripts/battle-lab-filter-audit.mjs
      - scripts/native-11-audit.mjs
      - .github/workflows/eas-update.yml

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[native-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify OTA/native integrity
        run: npm run verify

      - name: Load Expo production environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment production --path .env.local --non-interactive

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          FILE_NAME="$(node -p "require('./public/download/release.json').downloadFileName")"
          ARCHIVE_URL="$(node -p "require('./public/download/release.json').archiveUrl")"
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          DOWNLOAD_URL="$(node -p "require('./public/download/release.json').downloadUrl")"
          PROVIDER="$(node -p "require('./public/download/release.json').downloadProvider")"
          [[ "$FILE_NAME" =~ ^Trainer-Collection-v[0-9]+\.[0-9]+\.[0-9]+\.apk$ ]]
          [[ "$DOWNLOAD_URL" == "https://pokemon-cards-frontwork.expo.app/download-apk" ]]
          [[ "$PROVIDER" == "Trainer Collection Site" ]]
          curl --fail --location --retry 5 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/trainer-release.apk
          test "$(stat -c%s /tmp/trainer-release.apk)" -gt 100000000
          ACTUAL_SHA="$(sha256sum /tmp/trainer-release.apk | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          echo "Verified GitHub Release APK ready: $FILE_NAME"

      - name: Export web app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo export --platform web

      - name: Deploy web app to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --prod --environment production --dev-domain pokemon-cards-frontwork --non-interactive

      - name: Verify official page metadata
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          EXPECTED_URL="$(node -p "require('./public/download/release.json').downloadUrl")"
          EXPECTED_PROVIDER="$(node -p "require('./public/download/release.json').downloadProvider")"
          VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            CACHE_BUSTER="${GITHUB_SHA}-${attempt}"
            curl --fail --location --retry 2 --retry-delay 1 "https://pokemon-cards-frontwork.expo.app/download/release.json?v=${CACHE_BUSTER}" -o /tmp/site-release.json
            SITE_SHA="$(node -p "require('/tmp/site-release.json').sha256")"
            SITE_URL="$(node -p "require('/tmp/site-release.json').downloadUrl")"
            SITE_PROVIDER="$(node -p "require('/tmp/site-release.json').downloadProvider")"
            if [[ "${SITE_SHA,,}" == "${EXPECTED_SHA,,}" && "$SITE_URL" == "$EXPECTED_URL" && "$SITE_PROVIDER" == "$EXPECTED_PROVIDER" ]]; then
              VERIFIED=1
              break
            fi
            echo "Release metadata not propagated yet (attempt ${attempt}/6)."
            sleep 3
          done
          [[ "$VERIFIED" == "1" ]]
          echo "Official page exposes the verified same-site APK metadata."

          SITE_CHUNK=/tmp/site-apk-chunk.bin
          ARCHIVE_CHUNK=/tmp/archive-apk-chunk.bin
          curl --fail --location --retry 6 --retry-delay 3 --retry-all-errors --range 0-1048575             -D /tmp/site-apk-headers.txt             "https://pokemon-cards-frontwork.expo.app/download-apk"             -o "$SITE_CHUNK"
          head -c 1048576 /tmp/trainer-release.apk > "$ARCHIVE_CHUNK"
          [[ "$(sha256sum "$SITE_CHUNK" | awk '{print $1}')" == "$(sha256sum "$ARCHIVE_CHUNK" | awk '{print $1}')" ]]
          grep -qi 'content-disposition: attachment; filename="Trainer-Collection-v1.3.0.apk"' /tmp/site-apk-headers.txt
          echo "Same-site APK stream matches the verified release archive."

      - name: Publish Android update to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment production --platform android --message "Trainer Collection production $GITHUB_SHA" --non-interactive
