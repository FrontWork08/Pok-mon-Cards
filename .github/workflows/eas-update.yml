name: Publish Production Update

# Trainer Collection production deploy. Web/OTA updates always keep the currently
# verified APK available as a direct same-origin download on the official site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - src/**
      - assets/**
      - public/**
      - app.json
      - package.json
      - package-lock.json
      - scripts/generate-trainer-assets.py
      - scripts/project-audit.mjs
      - scripts/regression-audit.mjs
      - scripts/apk-security-audit.mjs
      - scripts/trainer-identity-audit.mjs
      - scripts/battle-lab-filter-audit.mjs
      - scripts/native-11-audit.mjs
      - .github/workflows/eas-update.yml

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured in this repository."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py

      - name: Verify OTA/native integrity
        run: npm run verify

      - name: Load Expo production environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull --environment production --path .env.local --non-interactive

      - name: Stage verified APK source
        shell: bash
        run: |
          set -euo pipefail
          FILE_NAME="$(node -p "require('./public/download/release.json').downloadFileName")"
          ARCHIVE_URL="$(node -p "require('./public/download/release.json').archiveUrl")"
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          DOWNLOAD_URL="$(node -p "require('./public/download/release.json').downloadUrl")"
          PROVIDER="$(node -p "require('./public/download/release.json').downloadProvider")"
          [[ "$FILE_NAME" =~ ^Trainer-Collection-v[0-9]+\.[0-9]+\.[0-9]+\.apk$ ]]
          [[ "$DOWNLOAD_URL" == "https://pokemon-cards-frontwork.expo.app/download/$FILE_NAME" ]]
          [[ "$PROVIDER" == "Trainer Collection Site" ]]
          mkdir -p public/download
          curl --fail --location --retry 5 --retry-delay 2 "$ARCHIVE_URL" -o "public/download/$FILE_NAME"
          ACTUAL_SHA="$(sha256sum "public/download/$FILE_NAME" | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          echo "Verified APK source ready: $FILE_NAME"

      - name: Export web app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo export --platform web

      - name: Inject verified APK into exported site
        shell: bash
        run: |
          set -euo pipefail
          FILE_NAME="$(node -p "require('./public/download/release.json').downloadFileName")"
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          mkdir -p dist/download
          cp "public/download/$FILE_NAME" "dist/download/$FILE_NAME"
          ACTUAL_SHA="$(sha256sum "dist/download/$FILE_NAME" | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          test "$(stat -c%s "dist/download/$FILE_NAME")" -gt 100000000
          echo "Direct APK injected into dist/download/$FILE_NAME"

      - name: Deploy web app to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas deploy --prod --environment production --dev-domain pokemon-cards-frontwork --non-interactive

      - name: Verify direct APK from official site
        shell: bash
        run: |
          set -euo pipefail
          FILE_NAME="$(node -p "require('./public/download/release.json').downloadFileName")"
          EXPECTED_SHA="$(node -p "require('./public/download/release.json').sha256")"
          SITE_APK="https://pokemon-cards-frontwork.expo.app/download/$FILE_NAME"
          curl --fail --location --retry 6 --retry-delay 3 "$SITE_APK" -o /tmp/trainer-site.apk
          test "$(stat -c%s /tmp/trainer-site.apk)" -gt 100000000
          ACTUAL_SHA="$(sha256sum /tmp/trainer-site.apk | awk '{print $1}')"
          [[ "${ACTUAL_SHA,,}" == "${EXPECTED_SHA,,}" ]]
          echo "Direct official-site APK is byte-identical to the verified release: $FILE_NAME"

      - name: Publish Android update to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel production --environment production --platform android --message "Trainer Collection production $GITHUB_SHA" --non-interactive
