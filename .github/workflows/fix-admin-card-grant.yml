name: Fix admin card grant

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-card-grant.yml
      - scripts/fix-admin-card-grant.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch card grant confirmation
        run: python scripts/fix-admin-card-grant.py
      - name: Install dependencies
        run: npm ci
      - name: Verify project
        run: npm run verify
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin-card-grant.tsx scripts/admin-card-grant-audit.mjs package.json
          git diff --cached --check
          git commit -m 'fix: make admin card grant actionable'
          git push
