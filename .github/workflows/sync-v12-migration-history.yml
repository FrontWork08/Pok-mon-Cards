name: Sync Trainer Collection 1.2 migration history

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/sync-v12-migration-history.yml
      - scripts/sync-v12-migration-history.mjs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.2-adventure-3d
          fetch-depth: 0

      - name: Verify source migrations exist
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            supabase/migrations/20260906051500_adventure_modes_v12.sql \
            supabase/migrations/20260906140000_enforce_adventure_team_rules_server_side.sql \
            supabase/migrations/20260906141000_track_pokemon_mastery_knockouts.sql \
            supabase/migrations/20260906141500_dedupe_mastery_by_species_and_track_kos.sql; do
            test -f "$file" || { echo "Missing source: $file"; exit 1; }
          done

      - name: Check synchronizer syntax
        run: node --check scripts/sync-v12-migration-history.mjs

      - name: Synchronize migration filenames and depth snapshot
        run: node scripts/sync-v12-migration-history.mjs

      - name: Verify exact production migration versions
        shell: bash
        run: |
          set -euo pipefail
          versions=(
            20260906051640 20260906052020 20260906052055 20260906052119
            20260906052223 20260906052241 20260906052713 20260906052736
            20260906140601 20260906141032 20260906141119
          )
          for version in "${versions[@]}"; do
            count=$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)
            test "$count" -eq 1 || { echo "Expected one migration for $version, got $count"; exit 1; }
          done
          ! find supabase/migrations -maxdepth 1 -type f \( -name '20260906051500_*' -o -name '20260906140000_*' -o -name '20260906141000_*' -o -name '20260906141500_*' \) | grep .
          node -e "const fs=require('fs');const s=fs.readFileSync('supabase/migrations/20260906052713_trainer_adventure_v12_depth.sql','utf8');for(const x of ['modifier text','adventure_pick_seeded_team','adventure_rival_team','trg_adventure_member_modifier','RAID_DAILY_LIMIT_REACHED','ELITE_ALREADY_COMPLETED_THIS_WEEK','CHAMPION_CANNOT_CHALLENGE_SELF'])if(!s.includes(x))throw new Error('Missing '+x)"

      - name: Commit synchronized history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          if git diff --cached --quiet; then
            echo "Migration history already synchronized"
            exit 0
          fi
          git commit -m "db: align Trainer Adventure 1.2 migration history"
          git push origin HEAD:feature/v1.2-adventure-3d
