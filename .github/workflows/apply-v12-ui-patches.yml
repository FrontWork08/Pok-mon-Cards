name: Apply Trainer Collection 1.2 UI patches

on:
  push:
    branches:
      - "feature/v1.2-adventure-3d"
    paths:
      - .github/workflows/apply-v12-ui-patches.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.2-adventure-3d
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply battle UI patch
        run: node scripts/patch-v12-ui.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck 1.2 changed files
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
          set -e
          if grep -E "(app/adventure\.tsx|app/kanto-adventure\.tsx|app/pokemon-mastery\.tsx|app/battle-records\.tsx|app/adventure-challenges\.tsx|src/components/AdaptiveBattleArena\.tsx|src/components/BattleArena3D|src/services/adventure\.ts|app/team-battle/\[id\]\.tsx|app/\(tabs\)/battles\.tsx)" /tmp/tsc.log; then
            echo "1.2 changed files have TypeScript errors"
            exit 1
          fi
          echo "No TypeScript errors reported in 1.2 changed files."

      - name: Commit UI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/team-battle/'[id].tsx' app/'(tabs)'/battles.tsx
          if git diff --cached --quiet; then
            echo "UI patch already applied"
            exit 0
          fi
          git commit -m "feat: expose Adventure 1.2 and adaptive 3D team arena"
          git push origin HEAD:feature/v1.2-adventure-3d
