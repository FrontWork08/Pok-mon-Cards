name: Patch Battle Style Arena
on:
  push:
    paths:
      - .github/workflows/patch-battle-style-arena.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Battle Style overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/team-battle/[id].tsx')
          s=p.read_text()
          imp="import { VIRTUAL_LIST_PERF_PROPS } from '@/performance/scrollPerformance';"
          add=imp+"\nimport { BattleStyleArenaOverlay } from '@/components/BattleStyleArenaOverlay';"
          if "BattleStyleArenaOverlay" not in s:
              if imp not in s: raise SystemExit('import target not found')
              s=s.replace(imp,add,1)
          target='<View style={[styles.arena, { backgroundColor: colors.surface, borderColor: colors.border }]}>'
          repl=target+'\n              <BattleStyleArenaOverlay turn={Number((state as any)?.turn ?? 1)} activeSlot={state?.myActiveSlot} />'
          if '<BattleStyleArenaOverlay turn=' not in s:
              if target not in s: raise SystemExit('arena target not found')
              s=s.replace(target,repl,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-battle-style-arena.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Battle Style Pass in 3x3 arena"
          git pull --rebase origin main
          git push
