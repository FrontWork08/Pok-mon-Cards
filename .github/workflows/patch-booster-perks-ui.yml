name: Patch booster perks UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-booster-perks-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Trainer Shop, Pack Lab and Admin
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise AssertionError(label)
              p.write_text(text.replace(old, new, 1))

          patch(
              'app/store.tsx',
              "import { TrainerAvatar } from '@/components/TrainerAvatar';\n",
              "import { TrainerAvatar } from '@/components/TrainerAvatar';\nimport { getBoosterPerks, type BoosterPerks } from '@/services/boosterPerks';\n",
              'store import anchor missing',
          )
          patch(
              'app/store.tsx',
              "  guild_decor:{label:'Decoração de Guilda',icon:'shield'},\n};",
              "  guild_decor:{label:'Decoração de Guilda',icon:'shield'},\n  consumable:{label:'Consumível de Booster',icon:'sparkles'},\n};",
              'store category anchor missing',
          )
          patch(
              'app/store.tsx',
              "  if(filter==='booster') return item.category==='booster_fx';",
              "  if(filter==='booster') return item.category==='booster_fx'||item.category==='consumable';",
              'store booster filter missing',
          )
          patch(
              'app/store.tsx',
              "  const [catalog,setCatalog]=useState<TrainerShopCatalog|null>(null);\n",
              "  const [catalog,setCatalog]=useState<TrainerShopCatalog|null>(null);\n  const [boosterPerks,setBoosterPerks]=useState<BoosterPerks|null>(null);\n",
              'store catalog state missing',
          )
          patch(
              'app/store.tsx',
              "      const next=await getTrainerShopCatalog();\n      setCatalog(next);",
              "      const [next,perks]=await Promise.all([\n        getTrainerShopCatalog(),\n        getBoosterPerks().catch(()=>null),\n      ]);\n      setCatalog(next);\n      setBoosterPerks(perks);",
              'store load anchor missing',
          )

          store_notice = "      {notice ? <Pressable onPress={()=>setNotice(null)} style={[styles.notice,{backgroundColor:'#183528',borderColor:'#3F9A68'}]}><Ionicons name=\"checkmark-circle\" size={18} color=\"#65D894\"/><Text style={styles.noticeText}>{notice}</Text><Ionicons name=\"close\" size={16} color=\"#9CCDB1\"/></Pressable> : null}\n"
          gamepass = "\n".join([
              "      <View style={[styles.gamepassCard,{backgroundColor:colors.surface,borderColor:boosterPerks?.autoOpenGamepass?'#59D49A':colors.yellow}] }>",
              "        <View style={[styles.gamepassIcon,{backgroundColor:boosterPerks?.autoOpenGamepass?'#15392A':colors.accentSoft}]}>",
              "          <Ionicons name={boosterPerks?.autoOpenGamepass?'flash':'lock-closed'} size={25} color={boosterPerks?.autoOpenGamepass?'#59D49A':colors.yellow}/>",
              "        </View>",
              "        <View style={styles.gamepassCopy}>",
              "          <View style={styles.badgeRow}>",
              "            <Text style={[styles.gamepassKicker,{color:colors.yellow}]}>GAMEPASS AUTO BOOSTER</Text>",
              "            <Text style={[styles.manualPayTag,{backgroundColor:boosterPerks?.autoOpenGamepass?'#15392A':'#3B2313',color:boosterPerks?.autoOpenGamepass?'#79E6AE':'#FFD447'}]}>{boosterPerks?.autoOpenGamepass?'ATIVA':'DINHEIRO REAL'}</Text>",
              "          </View>",
              "          <Text style={[styles.gamepassTitle,{color:colors.text}]}>Abertura automática de boosters</Text>",
              "          <Text style={[styles.gamepassText,{color:colors.muted}]}>{boosterPerks?.autoOpenGamepass",
              "            ? 'Escolha o booster e abra até 50 de uma vez, sempre vendo o custo total antes de confirmar.'",
              "            : `Esta gamepass não pode ser comprada com Coins ou Diamantes. Fale diretamente com ${boosterPerks?.contactOwnerUsername?'@'+boosterPerks.contactOwnerUsername:'o dono do jogo'} para comprar; depois da confirmação ela é ativada manualmente.`}</Text>",
              "          <Text style={[styles.luckyStatus,{color:colors.yellow}]}>✨ 2× Lucky disponível: {Number(boosterPerks?.lucky2xUses??0)} abertura(s)</Text>",
              "        </View>",
              "        <Pressable onPress={()=>router.push('/auto-open')} style={[styles.gamepassButton,{backgroundColor:boosterPerks?.autoOpenGamepass?'#59D49A':colors.yellow}]}>",
              "          <Ionicons name={boosterPerks?.autoOpenGamepass?'play':'information-circle'} size={17} color=\"#07111F\"/>",
              "          <Text style={styles.gamepassButtonText}>{boosterPerks?.autoOpenGamepass?'ABRIR AUTO BOOSTER':'COMO COMPRAR'}</Text>",
              "        </Pressable>",
              "      </View>",
              "",
          ]) + store_notice
          patch('app/store.tsx', store_notice, gamepass, 'store notice anchor missing')

          patch(
              'app/store.tsx',
              "  const galaxy=String(item.metadata?.effect??'')==='galaxy'||item.id.includes('galaxy');\n",
              "  const galaxy=String(item.metadata?.effect??'')==='galaxy'||item.id.includes('galaxy');\n  const consumable=item.category==='consumable';\n",
              'store galaxy anchor missing',
          )
          patch(
              'app/store.tsx',
              "          <Text style={[styles.priceLabel,{color:colors.muted}]}>{item.owned?'ITEM POSSUÍDO':'PREÇO'}</Text>\n          <Text style={[styles.price,{color:item.owned?accent:colors.yellow}]}>{item.owned?'✓ NA COLEÇÃO':`🪙 ${item.priceCoins.toLocaleString('pt-BR')}`}</Text>",
              "          <Text style={[styles.priceLabel,{color:colors.muted}]}>{consumable?'CONSUMÍVEL':item.owned?'ITEM POSSUÍDO':'PREÇO'}</Text>\n          <Text style={[styles.price,{color:consumable?colors.yellow:item.owned?accent:colors.yellow}]}>{consumable?`🪙 ${item.priceCoins.toLocaleString('pt-BR')}`:item.owned?'✓ NA COLEÇÃO':`🪙 ${item.priceCoins.toLocaleString('pt-BR')}`}</Text>",
              'store price anchor missing',
          )
          patch(
              'app/store.tsx',
              "  noticeText:{flex:1,color:'#D9FFE8',fontSize:9,lineHeight:14,fontWeight:'800'},\n",
              "  noticeText:{flex:1,color:'#D9FFE8',fontSize:9,lineHeight:14,fontWeight:'800'},\n  gamepassCard:{borderRadius:19,borderWidth:1,padding:13,flexDirection:'row',flexWrap:'wrap',alignItems:'center',gap:11},\n  gamepassIcon:{width:50,height:50,borderRadius:15,alignItems:'center',justifyContent:'center'},\n  gamepassCopy:{flex:1,minWidth:220,gap:2},gamepassKicker:{fontSize:7,fontWeight:'900',letterSpacing:1},manualPayTag:{fontSize:6,fontWeight:'900',borderRadius:999,paddingHorizontal:7,paddingVertical:3},gamepassTitle:{fontSize:15,fontWeight:'900'},gamepassText:{fontSize:8.5,lineHeight:13},luckyStatus:{fontSize:8,fontWeight:'900',marginTop:4},gamepassButton:{minHeight:42,borderRadius:12,paddingHorizontal:11,flexDirection:'row',alignItems:'center',justifyContent:'center',gap:5},gamepassButtonText:{color:'#07111F',fontSize:7.5,fontWeight:'900'},\n",
              'store style anchor missing',
          )

          patch(
              'app/(tabs)/packs.tsx',
              "import { useFocusEffect } from 'expo-router';",
              "import { useFocusEffect, useRouter } from 'expo-router';",
              'packs router import missing',
          )
          patch(
              'app/(tabs)/packs.tsx',
              "export default function PacksScreen() {\n  const { width } = useWindowDimensions();",
              "export default function PacksScreen() {\n  const router = useRouter();\n  const { width } = useWindowDimensions();",
              'packs component anchor missing',
          )
          packs_free = "      {freeUntil ? (\n"
          auto_panel = "\n".join([
              "      <Pressable onPress={()=>router.push('/auto-open')} style={[styles.autoOpenEntry,{backgroundColor:colors.surface,borderColor:colors.accent}]}>",
              "        <View style={[styles.autoOpenEntryIcon,{backgroundColor:colors.accentSoft}]}><Ionicons name=\"flash\" size={22} color={colors.yellow}/></View>",
              "        <View style={{flex:1,minWidth:180}}><Text style={[styles.autoOpenKicker,{color:colors.yellow}]}>AUTO BOOSTER</Text><Text style={[styles.autoOpenTitle,{color:colors.text}]}>Abrir vários boosters</Text><Text style={[styles.autoOpenText,{color:colors.muted}]}>Escolha o booster + quantidade e veja exatamente quanto vai gastar antes de confirmar.</Text></View>",
              "        <Ionicons name=\"chevron-forward\" size={20} color={colors.accent}/>",
              "      </Pressable>",
              "",
          ]) + packs_free
          patch('app/(tabs)/packs.tsx', packs_free, auto_panel, 'packs freeUntil anchor missing')
          patch(
              'app/(tabs)/packs.tsx',
              "  balanceActions:{flexDirection:'row',alignItems:'center',gap:7},exchangeButton:{minHeight:38,borderRadius:11,borderWidth:1,paddingHorizontal:9,flexDirection:'row',alignItems:'center',gap:5},exchangeText:{fontSize:8,fontWeight:'900'},balanceBadge: { width: 42, height: 42, borderRadius: 14, alignItems: 'center', justifyContent: 'center' },\n",
              "  balanceActions:{flexDirection:'row',alignItems:'center',gap:7},exchangeButton:{minHeight:38,borderRadius:11,borderWidth:1,paddingHorizontal:9,flexDirection:'row',alignItems:'center',gap:5},exchangeText:{fontSize:8,fontWeight:'900'},balanceBadge: { width: 42, height: 42, borderRadius: 14, alignItems: 'center', justifyContent: 'center' },\n  autoOpenEntry:{borderRadius:16,borderWidth:1,padding:11,flexDirection:'row',alignItems:'center',gap:10},autoOpenEntryIcon:{width:44,height:44,borderRadius:13,alignItems:'center',justifyContent:'center'},autoOpenKicker:{fontSize:7,fontWeight:'900',letterSpacing:1},autoOpenTitle:{fontSize:14,fontWeight:'900',marginTop:1},autoOpenText:{fontSize:8.5,lineHeight:13,marginTop:2},\n",
              'packs style anchor missing',
          )

          patch(
              'src/services/admin.ts',
              "export type AdminRedeemCode = { id: string; code: string; reward: { coins?: number; diamonds?: number; cardId?: string; cardQuantity?: number }; active: boolean; max_total_uses: number | null; expires_at: string | null; created_at: string; code_redemptions?: Array<{ count: number }> };",
              "export type AdminRedeemCode = { id: string; code: string; reward: { coins?: number; diamonds?: number; cardId?: string; cardQuantity?: number; lucky2xUses?: number }; active: boolean; max_total_uses: number | null; expires_at: string | null; created_at: string; code_redemptions?: Array<{ count: number }> };",
              'admin reward type anchor missing',
          )

          patch(
              'app/admin.tsx',
              "  const [codeDiamonds, setCodeDiamonds] = useState('');\n  const [codeCardId, setCodeCardId] = useState('');",
              "  const [codeDiamonds, setCodeDiamonds] = useState('');\n  const [codeLuckyUses, setCodeLuckyUses] = useState('');\n  const [codeCardId, setCodeCardId] = useState('');",
              'admin code state anchor missing',
          )
          patch(
              'app/admin.tsx',
              "    if (Number(codeDiamonds) > 0) reward.diamonds = Number(codeDiamonds);\n    if (codeCardId.trim() && Number(codeCardQuantity) > 0) {",
              "    if (Number(codeDiamonds) > 0) reward.diamonds = Number(codeDiamonds);\n    if (Number(codeLuckyUses) > 0) reward.lucky2xUses = Math.min(10000, Number(codeLuckyUses));\n    if (codeCardId.trim() && Number(codeCardQuantity) > 0) {",
              'admin code handler reward anchor missing',
          )
          patch(
              'app/admin.tsx',
              "    if (!reward.coins && !reward.diamonds && !reward.cardId) {",
              "    if (!reward.coins && !reward.diamonds && !reward.cardId && !reward.lucky2xUses) {",
              'admin empty reward anchor missing',
          )
          patch(
              'app/admin.tsx',
              "      setNewCode(''); setCodeCoins(''); setCodeDiamonds(''); setCodeCardId('');\n      setCodeCardQuantity('1'); setCodeMaxUses(''); setCodeExpiresHours('');",
              "      setNewCode(''); setCodeCoins(''); setCodeDiamonds(''); setCodeLuckyUses(''); setCodeCardId('');\n      setCodeCardQuantity('1'); setCodeMaxUses(''); setCodeExpiresHours('');",
              'admin reset code form anchor missing',
          )
          admin_diamond = "              <View style={styles.formField}><Text style={[styles.fieldLabel,{color:colors.muted}]}>DIAMANTES</Text><TextInput value={codeDiamonds} onChangeText={(v)=>setCodeDiamonds(v.replace(/[^0-9]/g,''))} keyboardType=\"number-pad\" placeholder=\"0\" placeholderTextColor={colors.muted} style={[styles.input,{color:colors.text,backgroundColor:colors.surfaceAlt,borderColor:colors.border}]}/></View>\n            </View>"
          admin_lucky = "              <View style={styles.formField}><Text style={[styles.fieldLabel,{color:colors.muted}]}>DIAMANTES</Text><TextInput value={codeDiamonds} onChangeText={(v)=>setCodeDiamonds(v.replace(/[^0-9]/g,''))} keyboardType=\"number-pad\" placeholder=\"0\" placeholderTextColor={colors.muted} style={[styles.input,{color:colors.text,backgroundColor:colors.surfaceAlt,borderColor:colors.border}]}/></View>\n              <View style={styles.formField}><Text style={[styles.fieldLabel,{color:colors.muted}]}>2× LUCKY • ABERTURAS</Text><TextInput value={codeLuckyUses} onChangeText={(v)=>setCodeLuckyUses(v.replace(/[^0-9]/g,'').slice(0,5))} keyboardType=\"number-pad\" placeholder=\"0\" placeholderTextColor={colors.muted} style={[styles.input,{color:colors.text,backgroundColor:colors.surfaceAlt,borderColor:colors.border}]}/></View>\n            </View>"
          patch('app/admin.tsx', admin_diamond, admin_lucky, 'admin code UI anchor missing')

          admin_hero_anchor = "          </View>\n\n          {adminAccess?.isOwner && releaseStatus ? ("
          owner_panel = "\n".join([
              "          </View>",
              "",
              "          {adminAccess?.isOwner ? (",
              "            <Pressable onPress={()=>router.push('/admin-gamepasses')} style={[styles.notice,{backgroundColor:'#241D3B',borderColor:'#9B7BFF'}]}>",
              "              <Ionicons name=\"flash\" size={20} color=\"#CBBEFF\"/>",
              "              <View style={{flex:1}}><Text style={[styles.historyUser,{color:colors.text}]}>GAMEPASS AUTO BOOSTER • VENDAS MANUAIS</Text><Text style={[styles.historyMeta,{color:colors.muted}]}>Ative ou remova a gamepass somente depois de confirmar diretamente o pagamento em dinheiro real.</Text></View>",
              "              <Ionicons name=\"chevron-forward\" size={18} color=\"#CBBEFF\"/>",
              "            </Pressable>",
              "          ) : null}",
              "",
              "          {adminAccess?.isOwner && releaseStatus ? (",
          ])
          patch('app/admin.tsx', admin_hero_anchor, owner_panel, 'admin owner panel anchor missing')
          patch(
              'app/admin.tsx',
              "  if(reward.cardId)parts.push(`🃏 ${reward.cardQuantity??1}× ${reward.cardId}`);\n  return parts.join(' • ');",
              "  if(reward.cardId)parts.push(`🃏 ${reward.cardQuantity??1}× ${reward.cardId}`);\n  if(Number(reward.lucky2xUses)>0)parts.push(`✨ 2× Lucky ${Number(reward.lucky2xUses)} abertura(s)`);\n  return parts.join(' • ');",
              'admin reward summary anchor missing',
          )

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/patch-booster-perks-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/store.tsx' 'app/(tabs)/packs.tsx' 'app/admin.tsx' 'src/services/admin.ts' .github/workflows/patch-booster-perks-ui.yml
          git commit -m "Expose Lucky and Auto Booster gamepass across the app"
          git push origin main
