name: SDK 57 Signed APK Candidate

on:
  push:
    branches:
      - native/sdk57-upgrade
    paths:
      - .github/workflows/sdk57-apk-candidate.yml

permissions:
  contents: read

concurrency:
  group: sdk57-signed-apk-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout SDK 57 candidate
        uses: actions/checkout@v4
        with:
          ref: native/sdk57-upgrade
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install SDK 57 graph
        run: npm ci
      - name: Prepare Trainer Collection artwork
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate-trainer-assets.py
      - name: Verify candidate before cloud build
        run: |
          npx expo-doctor@latest
          npm audit --omit=dev --audit-level=high
          npm run verify
      - name: Locate Android signature verifier
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER_PATH="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER_PATH"
          test -x "$APKSIGNER_PATH"
          echo "APKSIGNER=$APKSIGNER_PATH" >> "$GITHUB_ENV"
      - name: Build signed SDK 57 APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile release-apk --non-interactive --clear-cache
      - name: Download and verify signed APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm run apk:download
          SOURCE_APK="$(find builds -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$SOURCE_APK"
          node scripts/verify-apk-sounds.mjs "$SOURCE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK"
      - name: Upload private candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: Trainer-Collection-1.3.0-SDK57-Candidate
          path: builds/*
          if-no-files-found: error
          retention-days: 7
