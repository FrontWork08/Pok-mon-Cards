name: Patch 3D Black Screen
on:
  push:
    branches:
      - fix/3d-lab-black-screen
    paths:
      - .github/workflows/patch-3d-black-screen.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/3d-lab-black-screen
      - name: Apply Android 3D patch
        run: python scripts/patch-3d-black-screen.py
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-3d-black-screen.yml
          rm scripts/patch-3d-black-screen.py
          git config user.name "FrontWork08"
          git config user.email "frontwork08@users.noreply.github.com"
          git add src/components/BattleArena3D.native.tsx app/admin-3d-lab.tsx .github/workflows/patch-3d-black-screen.yml scripts/patch-3d-black-screen.py
          git commit -m "fix: prevent 3D lab black screen on Android"
          git push origin HEAD:fix/3d-lab-black-screen
