<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111F" />
    <meta name="description" content="Trainer Collection — abra packs, colecione cartas Pokémon, troque e batalhe com seus amigos." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trainer Collection" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var returnTo = params.get('preview_return');
          if (!returnTo) return;

          var target = new URL(returnTo);
          var allowedHost = 'pokemon-cards-frontwork--trainer-collection-v1-preview.expo.app';
          if (target.protocol !== 'https:' || target.hostname !== allowedHost) return;

          params.delete('preview_return');
          var remaining = params.toString();
          var destination = target.origin + target.pathname;
          if (remaining) destination += '?' + remaining;
          destination += window.location.hash || '';
          window.location.replace(destination);
        } catch (_) {
          // Never block the Beta if the bridge parameters are invalid.
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #07111f;
      }

      body {
        overflow: hidden;
        margin: 0;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Ative o JavaScript para abrir o Trainer Collection.</noscript>
    <div id="root"></div>
  </body>
</html>
